<html>
    <head>
        <title>Vasudeva Special</title>
        <style>
            img{
                width: 200px;
                margin-left: 650px;
            
                animation: krishn 1s ease alternate infinite;
            }
            @keyframes krishn {
                       from {
                        transform: scale(0);
                       }
                       to{
                        transform: scale(300px);
                       }

            }
            /* img:hover{
                transform: scale(1.7);
            } */
            h1{
                text-align: center;
            }
        </style>
    </head>
    <body>
        <h1>Vasudeva Special</h1>
        <img src="krishn.jpg" alt="Krishna">
    </body>
</html>
