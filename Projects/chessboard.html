<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chess Board</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #282828;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        div{
            border: 1px solid rgb(18, 6, 6);
        }

        .chessboard {
            width: 640px;
            height: 640px;

            display: grid;
            grid-template-columns: repeat(8, 1fr);
            grid-template-rows: repeat(8, 1fr);
            border: 5px solid #333;
        }

        .square {
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 60px;
        }

        .light {
            background-color: #eeeed2;
        }

        .dark {
            background-color: #4dac60;
        }
    </style>
</head>

<body>

    <div class="chessboard">

   
        <div class="square dark">♜</div>
        <div class="square light">♞</div>
        <div class="square dark">♝</div>
        <div class="square light">♛</div>
        <div class="square dark">♚</div>
        <div class="square light">♝</div>
        <div class="square dark">♞</div>
        <div class="square light">♜</div>

        
        <div class="square light">♟</div>
        <div class="square dark">♟</div>
        <div class="square light">♟</div>
        <div class="square dark">♟</div>
        <div class="square light">♟</div>
        <div class="square dark">♟</div>
        <div class="square light">♟</div>
        <div class="square dark">♟</div>

        
        <div class="square dark"></div>
        <div class="square light"></div>
        <div class="square dark"></div>
        <div class="square light"></div>
        <div class="square dark"></div>
        <div class="square light"></div>
        <div class="square dark"></div>
        <div class="square light"></div>

        <div class="square light"></div>
        <div class="square dark"></div>
        <div class="square light"></div>
        <div class="square dark"></div>
        <div class="square light"></div>
        <div class="square dark"></div>
        <div class="square light"></div>
        <div class="square dark"></div>

        
        <div class="square dark"></div>
        <div class="square light"></div>
        <div class="square dark"></div>
        <div class="square light"></div>
        <div class="square dark"></div>
        <div class="square light"></div>
        <div class="square dark"></div>
        <div class="square light"></div>

       
        <div class="square light"></div>
        <div class="square dark"></div>
        <div class="square light"></div>
        <div class="square dark"></div>
        <div class="square light"></div>
        <div class="square dark"></div>
        <div class="square light"></div>
        <div class="square dark"></div>

      
        <div class="square dark">♙</div>
        <div class="square light">♙</div>
        <div class="square dark">♙</div>
        <div class="square light">♙</div>
        <div class="square dark">♙</div>
        <div class="square light">♙</div>
        <div class="square dark">♙</div>
        <div class="square light">♙</div>

    
        <div class="square light">♖</div>
        <div class="square dark">♘</div>
        <div class="square light">♗</div>
        <div class="square dark">♕</div>
        <div class="square light">♔</div>
        <div class="square dark">♗</div>
        <div class="square light">♘</div>
        <div class="square dark">♖</div>

    </div>

</body>
</html>
